<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>Unordered List</h1>
    <ul>
        <li>Java</li>
        <li>Mysql</li>
        <li>Linux</li>
    </ul>
    <ol>
        <li>git</li>
        <li>jenkins</li>
        <li>aws</li>
    </ol>
    <h1>Description List</h1>
    <dl>
        <dt>html</dt>
        <dd>HTML stands for Hyper Text Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading style sheet</dd>
    </dl>
</body>
</html>
